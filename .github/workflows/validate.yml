name: validate

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv
          python3 -m venv .ansible-venv
          .ansible-venv/bin/python -m pip install --upgrade pip
          .ansible-venv/bin/python -m pip install --upgrade ansible==13.7.0
          echo "$PWD/.ansible-venv/bin" >> "$GITHUB_PATH"
          export PATH="$PWD/.ansible-venv/bin:$PATH"
          bun install
          bun run build
          bun run docs:build
          cd ansible
          for attempt in 1 2 3 4; do
            if ansible-galaxy collection install -r requirements.yml; then
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              exit 1
            fi
            sleep $((attempt * 5))
          done
      - name: Script validation
        run: |
          bash -n install.sh
          test -x dist/terrariumctl
          bun run tests/integration/index.ts --help
      - name: Ansible syntax
        run: |
          cd ansible
          ansible-playbook -i inventory.ini site.yml --syntax-check
