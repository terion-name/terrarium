- name: Install Cockpit
  ansible.builtin.apt:
    name:
      - cockpit
      - cockpit-packagekit
    state: present

- name: Allow root Cockpit login for Terrarium management
  ansible.builtin.lineinfile:
    path: /etc/cockpit/disallowed-users
    regexp: "^root$"
    state: absent
  notify: restart cockpit

- name: Trust Traefik management origin in Cockpit
  community.general.ini_file:
    path: /etc/cockpit/cockpit.conf
    section: WebService
    option: Origins
    value: "https://{{ terrarium_manage_domain }} wss://{{ terrarium_manage_domain }}"
    mode: "0644"
    no_extra_spaces: true
  notify: restart cockpit

- name: Tell Cockpit to honor Traefik forwarded scheme
  community.general.ini_file:
    path: /etc/cockpit/cockpit.conf
    section: WebService
    option: ProtocolHeader
    value: X-Forwarded-Proto
    mode: "0644"
    no_extra_spaces: true
  notify: restart cockpit

- name: Create cockpit socket override directory
  ansible.builtin.file:
    path: /etc/systemd/system/cockpit.socket.d
    state: directory
    mode: "0755"

- name: Bind cockpit to loopback
  ansible.builtin.copy:
    dest: /etc/systemd/system/cockpit.socket.d/override.conf
    mode: "0644"
    content: |
      [Socket]
      ListenStream=
      ListenStream=127.0.0.1:9090
  notify: restart cockpit

- name: Enable cockpit socket
  ansible.builtin.systemd:
    name: cockpit.socket
    state: started
    enabled: true
    daemon_reload: true
