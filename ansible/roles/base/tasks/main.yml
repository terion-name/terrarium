- name: Refresh apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ terrarium_base_packages }}"
    state: present

- name: Check optional kernel modules extra package candidate
  ansible.builtin.shell: |
    set -o pipefail
    apt-cache policy {{ terrarium_kernel_modules_extra_package | quote }} | awk '
      /^[[:space:]]*Candidate:/ {
        if ($2 != "(none)" && $2 != "") {
          found = 1
        }
      }
      END { exit(found ? 0 : 1) }
    '
  args:
    executable: /bin/bash
  register: terrarium_kernel_modules_extra_policy
  changed_when: false
  failed_when: false

- name: Install optional kernel modules extra package
  ansible.builtin.apt:
    name: "{{ terrarium_kernel_modules_extra_package }}"
    state: present
  register: terrarium_kernel_modules_extra_install
  failed_when:
    - terrarium_kernel_modules_extra_install is failed
    - >-
      ("No package matching '" ~ terrarium_kernel_modules_extra_package ~ "' is available")
      not in (terrarium_kernel_modules_extra_install.msg | default(''))
    - >-
      ("Unable to locate package " ~ terrarium_kernel_modules_extra_package)
      not in (terrarium_kernel_modules_extra_install.msg | default(''))
  when: terrarium_kernel_modules_extra_policy.rc == 0

- name: Enable snapd
  ansible.builtin.systemd:
    name: snapd
    state: started
    enabled: true

- name: Create Terrarium directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /etc/terrarium
    - /etc/terrarium/secrets
    - "{{ terrarium_state_dir }}"
    - "{{ terrarium_state_dir }}/catalog"
    - "{{ terrarium_state_dir }}/lastsnapshots"
    - "{{ terrarium_state_dir }}/restore"
    - /usr/local/lib/terrarium

- name: Assert Terrarium compiled binaries are staged in the install bundle
  ansible.builtin.stat:
    path: "{{ terrarium_repo_dir }}/dist/terrariumctl"
  register: terrarium_compiled_cli

- name: Fail when compiled binaries are missing
  ansible.builtin.assert:
    that:
      - terrarium_compiled_cli.stat.exists
    fail_msg: Compiled Terrarium binaries are missing from {{ terrarium_repo_dir }}/dist. Re-run install.sh.

- name: Install terrariumctl
  ansible.builtin.copy:
    src: "{{ terrarium_repo_dir }}/dist/terrariumctl"
    dest: /usr/local/bin/terrariumctl
    mode: "0755"
    remote_src: true

- name: Inspect existing terrariumctl shorthand alias
  ansible.builtin.stat:
    path: /usr/local/bin/trm
    follow: false
  register: terrarium_trm_alias

- name: Install terrariumctl shorthand alias
  ansible.builtin.file:
    src: /usr/local/bin/terrariumctl
    dest: /usr/local/bin/trm
    state: link
    force: true
  when: >-
    not terrarium_trm_alias.stat.exists
    or (
      terrarium_trm_alias.stat.islnk | default(false)
      and terrarium_trm_alias.stat.lnk_source == "/usr/local/bin/terrariumctl"
    )

- name: Warn when terrariumctl shorthand alias is unavailable
  ansible.builtin.debug:
    msg: /usr/local/bin/trm already exists and is not managed by Terrarium; leaving it untouched.
  when: >-
    terrarium_trm_alias.stat.exists
    and not (
      terrarium_trm_alias.stat.islnk | default(false)
      and terrarium_trm_alias.stat.lnk_source == "/usr/local/bin/terrariumctl"
    )

- name: Install Terrarium shell completions for available shells
  ansible.builtin.command: /usr/local/bin/terrariumctl completion all install
  changed_when: false

- name: Ensure root has a local password for Cockpit
  ansible.builtin.user:
    name: root
    password: "{{ terrarium_root_password_plaintext | password_hash('sha512') }}"
    update_password: always
  when:
    - terrarium_root_password_plaintext is defined
    - terrarium_root_password_plaintext | length > 0
  no_log: true

- name: Persist resolved Terrarium config
  ansible.builtin.copy:
    content: "{{ terrarium_config_bundle | to_nice_yaml(indent=2) }}"
    dest: "{{ terrarium_config_path }}"
    mode: "0600"
  no_log: true

- name: Create WireGuard configuration directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - path: /etc/terrarium/secrets/wireguard
      mode: "0700"
    - path: /etc/wireguard
      mode: "0700"
  when: terrarium_cluster_wireguard_enabled | bool

- name: Check local WireGuard private key
  ansible.builtin.stat:
    path: /etc/terrarium/secrets/wireguard/private.key
  register: terrarium_cluster_wireguard_private_key_stat
  when: terrarium_cluster_wireguard_enabled | bool

- name: Assert local WireGuard private key exists
  ansible.builtin.assert:
    that:
      - terrarium_cluster_wireguard_private_key_stat.stat.exists
    fail_msg: Terrarium cluster WireGuard is enabled, but /etc/terrarium/secrets/wireguard/private.key is missing. Join through terrariumctl cluster invite/join so the local key is installed.
  when: terrarium_cluster_wireguard_enabled | bool

- name: Read local WireGuard private key
  ansible.builtin.slurp:
    path: /etc/terrarium/secrets/wireguard/private.key
  register: terrarium_cluster_wireguard_private_key_raw
  when: terrarium_cluster_wireguard_enabled | bool
  no_log: true

- name: Resolve local WireGuard public key
  ansible.builtin.command: wg pubkey
  args:
    stdin: "{{ terrarium_cluster_wireguard_private_key_raw.content | b64decode }}"
  register: terrarium_cluster_wireguard_public_key_cmd
  changed_when: false
  when: terrarium_cluster_wireguard_enabled | bool
  no_log: true

- name: Resolve local WireGuard member
  ansible.builtin.set_fact:
    terrarium_cluster_wireguard_private_key_plain: "{{ terrarium_cluster_wireguard_private_key_raw.content | b64decode | trim }}"
    terrarium_cluster_wireguard_local_public_key: "{{ terrarium_cluster_wireguard_public_key_cmd.stdout | trim }}"
    terrarium_cluster_wireguard_local_member: >-
      {{
        (
          terrarium_cluster_wireguard_members
          | selectattr('public_key', 'equalto', terrarium_cluster_wireguard_public_key_cmd.stdout | trim)
          | list
          | first
        )
        | default({})
      }}
  when: terrarium_cluster_wireguard_enabled | bool
  no_log: true

- name: Assert local WireGuard member is registered
  ansible.builtin.assert:
    that:
      - terrarium_cluster_wireguard_local_member.tunnel_ip is defined
      - terrarium_cluster_wireguard_local_member.tunnel_ip | length > 0
    fail_msg: Local WireGuard public key is not registered in Terrarium cluster config.
  when: terrarium_cluster_wireguard_enabled | bool
  no_log: true

- name: Use WireGuard tunnel address for clustered LXD and OVN
  ansible.builtin.set_fact:
    terrarium_ovn_local_address: "{{ terrarium_cluster_wireguard_local_member.tunnel_ip }}"
  when:
    - terrarium_cluster_enabled | bool
    - terrarium_cluster_wireguard_enabled | bool

- name: Render WireGuard mesh config
  ansible.builtin.template:
    src: wireguard.conf.j2
    dest: "/etc/wireguard/{{ terrarium_cluster_wireguard_interface }}.conf"
    owner: root
    group: root
    mode: "0600"
  register: terrarium_cluster_wireguard_config
  when: terrarium_cluster_wireguard_enabled | bool
  no_log: true

- name: Enable WireGuard mesh interface
  ansible.builtin.systemd:
    name: "wg-quick@{{ terrarium_cluster_wireguard_interface }}"
    state: started
    enabled: true
  when: terrarium_cluster_wireguard_enabled | bool

- name: Restart WireGuard mesh interface after config changes
  ansible.builtin.systemd:
    name: "wg-quick@{{ terrarium_cluster_wireguard_interface }}"
    state: restarted
  when:
    - terrarium_cluster_wireguard_enabled | bool
    - terrarium_cluster_wireguard_config is changed

- name: Build Terrarium local hostnames list
  ansible.builtin.set_fact:
    terrarium_local_hostnames: >-
      {{
        [terrarium_manage_domain, terrarium_proxy_domain, terrarium_lxd_domain]
        + ([terrarium_auth_domain] if terrarium_idp_mode == 'local' else [])
      }}

- name: Ensure Terrarium domains resolve locally
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} ANSIBLE MANAGED BLOCK terrarium-domains"
    block: |
      127.0.0.1 {{ terrarium_local_hostnames | reject('equalto', '') | unique | join(' ') }}
  when: terrarium_local_hostnames | reject('equalto', '') | list | length > 0

- name: Configure UFW default deny incoming
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Configure UFW default allow outgoing
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: Allow required public ports
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - "22"
    - "80"
    - "443"

- name: Allow WireGuard mesh from configured peer endpoints
  community.general.ufw:
    rule: allow
    from_ip: "{{ item }}"
    port: "{{ terrarium_cluster_wireguard_port }}"
    proto: udp
  loop: "{{ terrarium_cluster_wireguard_endpoint_cidrs | default([]) }}"
  when: terrarium_cluster_wireguard_enabled | bool

- name: Allow LXD cluster API from configured peer networks
  community.general.ufw:
    rule: allow
    from_ip: "{{ item }}"
    port: "8443"
    proto: tcp
  loop: "{{ terrarium_cluster_peer_cidrs | default([]) }}"

- name: Allow OVN cluster database and overlay traffic from configured peer networks
  community.general.ufw:
    rule: allow
    from_ip: "{{ item.0 }}"
    port: "{{ item.1.port }}"
    proto: "{{ item.1.proto }}"
  loop: "{{ (terrarium_cluster_peer_cidrs | default([])) | product([{'port': '6081', 'proto': 'udp'}, {'port': '6641', 'proto': 'tcp'}, {'port': '6642', 'proto': 'tcp'}]) | list }}"

- name: Enable UFW
  community.general.ufw:
    state: enabled
