terrarium_lxd_snap_channel: latest/stable
terrarium_lxd_auth_group: terrarium-management
terrarium_lxd_oidc_groups_claim: ""
terrarium_lxd_oidc_scopes: ""
terrarium_lxd_oidc_groups_claim_effective: "{{ terrarium_lxd_oidc_groups_claim | default(terrarium_oidc_groups_claim_effective | default(terrarium_oidc_groups_claim | default('groups', true), true), true) }}"
terrarium_lxd_oidc_scopes_effective: "{{ terrarium_lxd_oidc_scopes | default(terrarium_oidc_scopes_effective | default(terrarium_oidc_scopes | default('openid profile email', true), true), true) }}"
terrarium_lxd_idp_group_state_path: "{{ terrarium_state_dir }}/lxd-idp-admin-group"
terrarium_cluster_enabled: false
terrarium_cluster_wireguard_enabled: false
terrarium_lxd_network_parent: lxdbr0
terrarium_lxd_network_name: terrarium-ovn
terrarium_lxd_parent_ipv4: 10.154.0.1/24
terrarium_lxd_parent_dhcp_range: 10.154.0.2-10.154.0.199
terrarium_lxd_parent_ovn_range: 10.154.0.200-10.154.0.254
terrarium_ovn_central_addresses: []
terrarium_ovn_local_address: "{{ ansible_default_ipv4.address }}"
terrarium_ovn_ca_cert: ""
terrarium_ovn_ca_key: ""
