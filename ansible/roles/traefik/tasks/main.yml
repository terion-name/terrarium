- name: Map Traefik release architecture
  ansible.builtin.set_fact:
    terrarium_traefik_arch: >-
      {{
        {
          'x86_64': 'amd64',
          'aarch64': 'arm64'
        }[ansible_architecture]
      }}

- name: Compute Traefik release archive metadata
  ansible.builtin.set_fact:
    terrarium_traefik_archive: "traefik_{{ terrarium_traefik_version }}_linux_{{ terrarium_traefik_arch }}.tar.gz"
    terrarium_traefik_archive_checksum: "{{ terrarium_traefik_sha256[terrarium_traefik_arch] }}"

- name: Create private Traefik release work directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop:
    - "{{ terrarium_traefik_download_dir }}"
    - "{{ terrarium_traefik_stage_dir }}"

- name: Download Traefik release archive
  ansible.builtin.get_url:
    url: "https://github.com/traefik/traefik/releases/download/{{ terrarium_traefik_version }}/{{ terrarium_traefik_archive }}"
    dest: "{{ terrarium_traefik_download_dir }}/{{ terrarium_traefik_archive }}"
    checksum: "sha256:{{ terrarium_traefik_archive_checksum }}"
    owner: root
    group: root
    mode: "0600"
  register: terrarium_traefik_download
  until: terrarium_traefik_download is succeeded
  retries: 5
  delay: 10

- name: Validate Traefik release archive metadata
  ansible.builtin.shell: |
    set -euo pipefail
    archive="{{ terrarium_traefik_download.dest }}"
    tar -tzf "$archive" | while IFS= read -r member; do
      [ -n "$member" ] || continue
      case "$member" in
        /*|../*|*/../*|*/..|..)
          echo "unsafe archive member path: $member" >&2
          exit 1
          ;;
      esac
      case "$member" in
        traefik|CHANGELOG.md|LICENSE.md) ;;
        *)
          echo "unexpected Traefik archive member: $member" >&2
          exit 1
          ;;
      esac
    done
    tar -tvzf "$archive" | awk '$1 ~ /^[hlbcps]/ { print "unsafe archive member type: " $0 > "/dev/stderr"; bad = 1 } END { exit bad ? 1 : 0 }'
  args:
    executable: /bin/bash
  changed_when: false

- name: Install Traefik binary
  ansible.builtin.shell: |
    set -euo pipefail
    archive="{{ terrarium_traefik_download.dest }}"
    stage="{{ terrarium_traefik_stage_dir }}/{{ terrarium_traefik_version }}-{{ terrarium_traefik_arch }}"
    rm -rf "$stage"
    mkdir -p "$stage"
    tar -xzf "$archive" -C "$stage" --no-same-owner --no-same-permissions
    install -o root -g root -m 0755 "$stage/traefik" /usr/local/bin/traefik
  args:
    executable: /bin/bash

- name: Install Traefik systemd service
  ansible.builtin.template:
    src: traefik.service.j2
    dest: /etc/systemd/system/traefik.service
    mode: "0644"
  notify: reload traefik systemd

- name: Create Traefik directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ terrarium_traefik_config_dir }}"
    - "{{ terrarium_traefik_config_dir }}/dynamic"
    - "{{ terrarium_traefik_config_dir }}/bootstrap-certs"
    - /var/lib/traefik

- name: Create Traefik secret directory
  ansible.builtin.file:
    path: /etc/terrarium/secrets
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Determine whether bootstrap TLS is required
  ansible.builtin.set_fact:
    terrarium_bootstrap_tls_enabled: "{{ terrarium_idp_mode == 'local' and (terrarium_auth_domain | default('') | length > 0) }}"

- name: Build bootstrap certificate SAN list
  ansible.builtin.set_fact:
    terrarium_bootstrap_tls_domains: >-
      {{
        [terrarium_auth_domain] if terrarium_bootstrap_tls_enabled else []
      }}

- name: Render Traefik bootstrap certificate OpenSSL config
  ansible.builtin.template:
    src: bootstrap-cert-openssl.cnf.j2
    dest: "{{ terrarium_traefik_config_dir }}/bootstrap-certs/openssl.cnf"
    mode: "0644"
  register: terrarium_bootstrap_tls_openssl_config
  when: terrarium_bootstrap_tls_enabled

- name: Check whether Traefik bootstrap certificate exists
  ansible.builtin.stat:
    path: "{{ terrarium_traefik_config_dir }}/bootstrap-certs/terrarium-bootstrap.crt"
  register: terrarium_bootstrap_tls_cert_stat
  when: terrarium_bootstrap_tls_enabled

- name: Generate Traefik bootstrap certificate
  ansible.builtin.command:
    argv:
      - openssl
      - req
      - -x509
      - -nodes
      - -days
      - "7"
      - -newkey
      - rsa:2048
      - -keyout
      - "{{ terrarium_traefik_config_dir }}/bootstrap-certs/terrarium-bootstrap.key"
      - -out
      - "{{ terrarium_traefik_config_dir }}/bootstrap-certs/terrarium-bootstrap.crt"
      - -config
      - "{{ terrarium_traefik_config_dir }}/bootstrap-certs/openssl.cnf"
  when:
    - terrarium_bootstrap_tls_enabled
    - terrarium_bootstrap_tls_openssl_config.changed or not terrarium_bootstrap_tls_cert_stat.stat.exists
  notify: restart traefik

- name: Render Traefik bootstrap certificate config
  ansible.builtin.template:
    src: bootstrap-cert.yml.j2
    dest: "{{ terrarium_traefik_config_dir }}/dynamic/bootstrap-cert.yml"
    mode: "0644"
  notify: restart traefik
  when: terrarium_bootstrap_tls_enabled

- name: Remove Traefik bootstrap certificate config when bootstrap TLS is not required
  ansible.builtin.file:
    path: "{{ terrarium_traefik_config_dir }}/dynamic/bootstrap-cert.yml"
    state: absent
  notify: restart traefik
  when: not terrarium_bootstrap_tls_enabled

- name: Install Traefik bootstrap certificate into system trust store
  ansible.builtin.copy:
    src: "{{ terrarium_traefik_config_dir }}/bootstrap-certs/terrarium-bootstrap.crt"
    dest: /usr/local/share/ca-certificates/terrarium-bootstrap.crt
    mode: "0644"
    remote_src: true
  register: terrarium_bootstrap_tls_system_ca
  when: terrarium_bootstrap_tls_enabled

- name: Refresh system CA certificates for bootstrap trust
  ansible.builtin.command: update-ca-certificates
  when:
    - terrarium_bootstrap_tls_enabled
    - terrarium_bootstrap_tls_system_ca.changed
  changed_when: terrarium_bootstrap_tls_system_ca.changed

- name: Restart LXD after bootstrap trust changes
  ansible.builtin.command: systemctl try-restart snap.lxd.daemon.service
  when:
    - terrarium_bootstrap_tls_enabled
    - terrarium_bootstrap_tls_system_ca.changed
  changed_when: false
  failed_when: false

- name: Create ACME storage file
  ansible.builtin.file:
    path: /var/lib/traefik/acme.json
    state: touch
    mode: "0600"

- name: Render Traefik DNS challenge credential environment
  ansible.builtin.template:
    src: traefik-dns.env.j2
    dest: /etc/terrarium/secrets/traefik-dns.env
    owner: root
    group: root
    mode: "0600"
  notify: restart traefik
  when: terrarium_acme_dns_provider | default('') | length > 0

- name: Remove Traefik DNS challenge credential environment when DNS-01 is disabled
  ansible.builtin.file:
    path: /etc/terrarium/secrets/traefik-dns.env
    state: absent
  notify: restart traefik
  when: terrarium_acme_dns_provider | default('') | length == 0

- name: Render Traefik static config
  ansible.builtin.template:
    src: traefik.yml.j2
    dest: "{{ terrarium_traefik_config_dir }}/traefik.yml"
    mode: "0644"
  notify: restart traefik

- name: Render Traefik dynamic routes
  ansible.builtin.template:
    src: terrarium-dynamic.yml.j2
    dest: "{{ terrarium_traefik_config_dir }}/dynamic/terrarium.yml"
    mode: "0644"
  notify: restart traefik

- name: Render temporary Traefik bootstrap routes
  ansible.builtin.template:
    src: bootstrap-routes.yml.j2
    dest: "{{ terrarium_traefik_config_dir }}/dynamic/bootstrap-routes.yml"
    mode: "0644"
  notify: restart traefik
  when: terrarium_bootstrap_tls_enabled

- name: Remove temporary Traefik bootstrap routes when bootstrap TLS is not required
  ansible.builtin.file:
    path: "{{ terrarium_traefik_config_dir }}/dynamic/bootstrap-routes.yml"
    state: absent
  notify: restart traefik
  when: not terrarium_bootstrap_tls_enabled

- name: Install Traefik sync service
  ansible.builtin.template:
    src: terrarium-traefik-sync.service.j2
    dest: /etc/systemd/system/terrarium-traefik-sync.service
    mode: "0644"
  notify: reload traefik sync systemd

- name: Install Traefik sync timer
  ansible.builtin.copy:
    dest: /etc/systemd/system/terrarium-traefik-sync.timer
    mode: "0644"
    content: |
      [Unit]
      Description=Run Terrarium Traefik sync every minute

      [Timer]
      OnCalendar=*-*-* *:*:00
      AccuracySec=1s
      Persistent=true

      [Install]
      WantedBy=timers.target
  notify: reload traefik sync systemd

- name: Enable Traefik
  ansible.builtin.systemd:
    name: traefik
    state: started
    enabled: true
    daemon_reload: true
