- name: Check provider-managed root SSH authorized keys
  ansible.builtin.stat:
    path: /etc/ssh/authorized_keys/root
  register: terrarium_hardening_provider_root_authorized_keys

- name: Enforce provider-managed root SSH key permissions
  ansible.builtin.file:
    path: /etc/ssh/authorized_keys/root
    owner: root
    group: root
    mode: "0600"
  when: terrarium_hardening_provider_root_authorized_keys.stat.exists | default(false)

- name: Read provider-managed root SSH authorized keys
  ansible.builtin.slurp:
    path: /etc/ssh/authorized_keys/root
  register: terrarium_hardening_provider_root_authorized_keys_content
  when: terrarium_hardening_provider_root_authorized_keys.stat.exists | default(false)

- name: Build provider-managed root SSH authorized key list
  ansible.builtin.set_fact:
    terrarium_hardening_provider_root_authorized_key_lines: >-
      {{
        (terrarium_hardening_provider_root_authorized_keys_content.content | b64decode).splitlines()
        | map('trim')
        | reject('equalto', '')
        | unique
        | list
      }}
  when: terrarium_hardening_provider_root_authorized_keys.stat.exists | default(false)

- name: Check root SSH authorized keys
  ansible.builtin.stat:
    path: /root/.ssh/authorized_keys
  register: terrarium_hardening_root_authorized_keys

- name: Remove provider-managed root SSH keys from OpenSSH default location
  ansible.builtin.lineinfile:
    path: /root/.ssh/authorized_keys
    line: "{{ item }}"
    state: absent
  loop: "{{ terrarium_hardening_provider_root_authorized_key_lines | default([]) }}"
  when:
    - terrarium_hardening_provider_root_authorized_keys.stat.exists | default(false)
    - terrarium_hardening_root_authorized_keys.stat.exists | default(false)

- name: Enforce strict root SSH directory permissions
  ansible.builtin.file:
    path: /root/.ssh
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: terrarium_hardening_root_authorized_keys.stat.exists | default(false)

- name: Enforce strict root SSH authorized key permissions
  ansible.builtin.file:
    path: /root/.ssh/authorized_keys
    owner: root
    group: root
    mode: "0600"
  when: terrarium_hardening_root_authorized_keys.stat.exists | default(false)

- name: Apply dev-sec OS hardening
  ansible.builtin.include_role:
    name: devsec.hardening.os_hardening
  vars:
    sysctl_overwrite: "{{ terrarium_hardening_sysctl_overwrite }}"
    os_firewall: "{{ terrarium_hardening_os_firewall }}"
    manage_ufw: "{{ terrarium_hardening_manage_ufw }}"

- name: Apply dev-sec SSH hardening
  ansible.builtin.include_role:
    name: devsec.hardening.ssh_hardening
  vars:
    ssh_permit_root_login: "{{ terrarium_hardening_ssh_permit_root_login }}"
    ssh_server_password_login: "{{ terrarium_hardening_ssh_server_password_login }}"
    ssh_use_pam: "{{ terrarium_hardening_ssh_use_pam }}"
    ssh_authorized_keys_file: "{{ terrarium_hardening_ssh_authorized_keys_file }}"
    ssh_client_alive_interval: "{{ terrarium_hardening_ssh_client_alive_interval }}"
    ssh_client_alive_count: "{{ terrarium_hardening_ssh_client_alive_count }}"
    ssh_max_auth_retries: "{{ terrarium_hardening_ssh_max_auth_retries }}"
